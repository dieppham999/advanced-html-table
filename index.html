<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <title>Thời khóa biểu</title>
</head>
<body>
    <h2> Thời Khóa Biểu</h2>
    <table>
       <tr>
            <th rowspan="2">Thứ</th>
            <th colspan="2">Hoạt động</th>
       </tr>
       <tr>
            <th>Sáng</th>
            <th>Chiều</th>
       </tr>
       <tr>
            <td>Thứ Hai</td>
            <td>Thể dục</td>
            <td>HD trò chơi mới</td>
       </tr>
       <tr>
            <td>Thứ Ba</td>
            <td>Nhận biết tập nói</td>
            <td>Rèn nề nếp kỹ năng sống</td>
       </tr>
       <tr>
            <td>Thứ Tư</td>
            <td>Âm nhạc</td>
            <td>Vui chơi</td>
       </tr>
       <tr>
            <td>Thứ Năm</td>
            <td>Văn học</td>
            <td>Nhận biết các giá trị sống</td>
       </tr>
       <tr>
            <td>Thứ Sáu</td>
            <td>Tạo hình</td>
            <td>Biểu diễn văn nghệ</td>
       </tr>
       <tr>
            <td>Thứ Bảy</td>
            <td>Làm quen với Toán</td>
            <td>Bé vui học</td>
       </tr>
    </table>

</html>
